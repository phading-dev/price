- kind: Enum
  name: ProductID
  values:
    # Never deletes or changes the value of the enum. It serves as the permanent identifier of a product.
    - name: STORAGE
      value: 1
    - name: UPLOAD
      value: 2
    - name: NETWORK
      value: 3
- kind: Message
  name: PlatformPrice
  fields:
    - name: productID
      type: ProductID
      index: 1
    - name: description
      type: string
      index: 2
    - name: startMonth
      type: string
      index: 3
    - name: endMonth
      type: string
      index: 4
    # ${quantity} unit = ${amount} COIN
    - name: amount
      type: number
      index: 5
    - name: quantity
      type: number
      index: 6
    - name: unit # quantity's unit
      type: string
      index: 7
- kind: Message
  name: PlatformPrices
  fields:
    - name: prices
      type: PlatformPrice
      isArray: true
      index: 1
